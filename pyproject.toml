[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-transcriber"
version = "0.1.0"
description = "Detect listened Spotify podcast episodes, transcribe locally, summarize, and deliver."
requires-python = ">=3.10"
dependencies = [
    "spotipy==2.24.0",
    "python-dotenv==1.0.1",
    "feedparser==6.0.14",   # Parses podcast RSS feeds (Stage 2). 6.0.14 ships
                            # a pure-wheel sgmllib, avoiding a source build that
                            # needs a compiler (a real gotcha on Windows/Pi).
    "requests>=2.32.0",     # HTTP for feed discovery + audio download.
]

[project.scripts]
# Lets you type `podcast-transcriber ...` instead of the longer
# `python -m podcast_transcriber ...`, once installed.
podcast-transcriber = "podcast_transcriber.__main__:main"

[tool.setuptools.packages.find]
# Our package lives under src/ (a "src layout"), which keeps the importable
# code cleanly separated from config and docs.
where = ["src"]
